name: Compila l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Scarica il modello vocale italiano
        run: |
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-it-0.22.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-it
          mv vosk-model-small-it-0.22 app/src/main/assets/model-it
          uuidgen > app/src/main/assets/model-it/uuid

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compila
        run: gradle --no-daemon assembleDebug

      - name: Pubblica il file da installare
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          name: La mia mente 0.7 (build ${{ github.run_number }})
          body: Primo file da installare sul telefono. Apri questa pagina dal Galaxy e scarica app-debug.apk.
          files: app/build/outputs/apk/debug/app-debug.apk
